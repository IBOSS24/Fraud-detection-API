name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  docker-release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fraud-api:test .

      - name: Get release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run container
        run: docker run -d --name fraud-api-release -p 8000:8000 fraud-api:test

      - name: Wait for API readiness
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              echo "API is ready"
              exit 0
            fi
            echo "API not ready yet. Retrying..."
            sleep 2
          done

          echo "API failed to become ready"
          docker logs fraud-api-release
          exit 1

      - name: Tag release image
        run: docker tag fraud-api:test iboss17/fraud-api:${{ steps.version.outputs.version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push release image
        run: docker push iboss17/fraud-api:${{ steps.version.outputs.version }}

      - name: Stop and remove container
        if: always()
        run: docker rm -f fraud-api-release