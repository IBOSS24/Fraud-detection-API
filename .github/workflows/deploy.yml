name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker release version to deploy, e.g. 1.1.5"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment version
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $TARGET_VERSION"
            exit 1
          fi

          echo "Target version: $TARGET_VERSION"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare deployment command
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          script = Path("scripts/deploy.sh").read_bytes()
          encoded = base64.b64encode(script).decode("ascii")
          version = os.environ["TARGET_VERSION"]

          command = (
              f"printf '%s' '{encoded}' | base64 -d > /tmp/deploy.sh"
              f" && chmod 700 /tmp/deploy.sh"
              f" && /tmp/deploy.sh '{version}'"
          )

          with open("ssm-parameters.json", "w") as f:
              json.dump(
                  {
                      "commands": [command],
                      "executionTimeout": ["1800"]
                  },
                  f
              )
          PY

      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --comment "Deploy Fraud API ${TARGET_VERSION}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for i in {1..360}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "----- deploy.sh output -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text

          echo "----- deploy.sh errors -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text

          echo "SSM command status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi