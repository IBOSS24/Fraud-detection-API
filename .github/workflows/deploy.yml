name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker release version to deploy, e.g. 1.1.3"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment version
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $TARGET_VERSION"
            exit 1
          fi

          echo "Target version: $TARGET_VERSION"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -T 5 -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deployment script to EC2
        run: |
          scp \
            -i ~/.ssh/ec2_key \
            scripts/deploy.sh \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:/home/${{ vars.EC2_USER }}/deploy.sh"

      - name: Deploy release
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" \
            "chmod +x ~/deploy.sh && ~/deploy.sh '$TARGET_VERSION'"