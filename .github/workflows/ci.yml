name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest
  changes:
    runs-on: ubuntu-latest

    outputs:
      docker: ${{ steps.filter.outputs.docker }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'api/**'
              - 'models/**'
              - 'requirements.txt'
              - 'Dockerfile'
              - '.dockerignore'
  docker-build:
    needs:
      - test
      - changes

    if: github.ref == 'refs/heads/main' && needs.changes.outputs.docker == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fraud-api:test .

      - name: Run container
        run: docker run -d --name fraud-api-test -p 8000:8000 fraud-api:test

      - name: Wait for API readiness
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              echo "API is ready"
              exit 0
            fi
            echo "API not ready yet. Retrying..."
            sleep 2
          done

          echo "API failed to become ready"
          docker logs fraud-api-test
          exit 1

      - name: Stop and remove container
        if: always()
        run: docker rm -f fraud-api-test
           